org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# JDK 25 toolchain — Foojay auto-download fails on this Windows box (its
# tmp->jdks move step errors), so we point Gradle directly at a manually
# extracted Temurin 25 and disable auto-download. Forward slashes avoid
# .properties backslash-escaping.
org.gradle.java.installations.paths=C:/jdks/jdk25/jdk-25.0.3+9
org.gradle.java.installations.auto-download=false

# Minecraft 26.1.2 (the latest stable Java Edition release in the new
# year-based version-numbering scheme; replaces the 1.21.x line).
# 26.1 is the first unobfuscated MC build — Yarn mappings are GONE,
# we compile directly against Mojang's official names.
minecraft_version=26.1.2
loader_version=0.18.4
loom_version=1.15.5

# Fabric API for 26.1.2 (Modrinth: 0.145.4+26.1.2, Apr 2026; newer
# 0.148.2 also available).
fabric_version=0.145.4+26.1.2

# Mod metadata — bumped to 5.0.0 to mark the breaking ecosystem jump
# from the 4.x (1.21.11) line.
mod_version=5.0.0
maven_group=net.skyz
archives_base_name=skyz-client

# Mod Menu — 18.x is the 26.1 line.
modmenu_version=18.0.0-alpha.8

# owo-lib — declarative XML UI framework, 0.13.0 build for 26.1.
owo_version=0.13.0+26.1
